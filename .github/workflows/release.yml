name: Release

# git-flow finishes a release by creating a vX.Y.Z tag on main; pushing that
# tag triggers GoReleaser, which builds the cross-platform binaries, uploads
# them with checksums, and publishes the GitHub Release (notes are GitHub's
# native generated notes, per .goreleaser.yaml's changelog.use: github-native).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # create the GitHub Release and upload assets
  id-token: write # OIDC token for keyless (Sigstore) signing of the attestation
  attestations: write # store the SLSA build-provenance attestation

jobs:
  goreleaser:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # SLSA build provenance (Build L1): a signed attestation describing how
      # each release artifact was built. Verify with:
      #   gh attestation verify <artifact> --repo peczenyj/structalign
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
