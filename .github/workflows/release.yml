name: Release

# git-flow finishes a release by creating a vX.Y.Z tag on main; pushing that
# tag triggers GoReleaser, which builds the cross-platform binaries, uploads
# them with checksums, and publishes the GitHub Release (notes are GitHub's
# native generated notes, per .goreleaser.yaml's changelog.use: github-native).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
