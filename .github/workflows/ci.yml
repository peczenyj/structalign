name: CI

on:
  push:
    branches: [main, devel, "release/**", "hotfix/**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.25.0", "stable"]
    name: build (go ${{ matrix.go-version }})
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ matrix.go-version }}

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./cmd/structalign

      - name: Smoke test
        run: |
          go run ./cmd/structalign -inspect ./_example
          # diff mode exits 1 when reorderings exist; assert that contract holds
          if go run ./cmd/structalign ./_example; then
            echo "expected non-zero exit when reorderings are found"; exit 1
          fi
