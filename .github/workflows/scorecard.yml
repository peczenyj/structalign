name: Scorecard supply-chain security

# OpenSSF Scorecard grades this repo's security posture, publishes the result to
# the public OpenSSF API (which powers the README badge / scorecard.dev viewer),
# and uploads findings to the Security tab as code scanning. publish_results and
# the badge only work when the analysis runs on the repository's default branch
# (devel here), so the push trigger targets that branch.
on:
  branch_protection_rule:
  schedule:
    - cron: '30 1 * * 6' # Saturdays 01:30 UTC
  push:
    branches: ["devel"]

# Declare default (read-only) token permissions; the job elevates only what it needs.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload the SARIF result to code scanning
      id-token: write # OIDC token to publish results to the OpenSSF API

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@e46ed2cbd01164d986452f91f178727624ae40d7 # v4.35.3
        with:
          sarif_file: results.sarif
