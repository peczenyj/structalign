# Codecov configuration. https://docs.codecov.com/docs/codecovyml-reference
coverage:
  status:
    project:
      default:
        # Overall project coverage target; allow a small drop before failing.
        target: 70%
        threshold: 1%
    patch:
      default:
        target: 70%

# Coverage is computed over `go list ./...` minus mocks (see Taskfile PKG_LIST).
# Also drop generated and test files from the report so they don't skew numbers.
ignore:
  - "**/*_test.go"
  - "**/*_enumer.go"      # generated by enumer
  - "**/mocks/**"          # generated by mockery
  - "**/testutil/**"       # test-support helpers (exercised via other packages)
  - "main.go" # thin entrypoint (os.Exit(app.Run))
